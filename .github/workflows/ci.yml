name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cliente (typecheck + build)
        run: |
          cd client
          npm install
          npm run build
      - name: Servidor (typecheck)
        run: |
          cd worker
          npm install
          npm run typecheck
