# Genera el instalador .exe (Windows) al crear una etiqueta v*, y lo publica en Releases.
# Define la variable de repositorio SERVER_URL (p. ej. https://call-center-server.TU-CUENTA.workers.dev).
name: Release escritorio
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencias
        run: |
          npm install
          npm --prefix client install
      - name: Iconos
        run: npx tauri icon src-tauri/app-icon.png
      - name: Compilar
        run: npx tauri build
        env:
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: call-center-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/call-center.exe
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/call-center.exe
